{% extends "base.html" %} 
{% block content %}
<h1>Hello, <a href="/{{ current_user.username }}">{{ current_user.username }}</a></h1>


{% for tweet in tweets %}
<table>
<tr>
    <td><td><img src="{{tweet.author.avatar(60) }}" alt=""></td></td>
    <td><p>{{ tweet.author.username }} says: <b>{{ tweet.body }}</b></p></td>
</tr>
</table>
{% endfor %} {% endblock %}
