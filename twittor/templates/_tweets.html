
<table>
    {% for tweet in tweets %}
    <tr valign="top">
        <td><td><img src="{{tweet.author.avatar(48) }}" alt=""></td></td>
        <td>
            <a href="{{ url_for('profile', username=tweet.author.username) }}"><b>{{ tweet.author.username }}</b></a> 
            {{ tweet.create_time }}<br>
            {{ tweet.body }}
        </td>
    </tr>
    {% endfor %} 
</table>
